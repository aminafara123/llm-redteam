[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-redteam"
version = "0.1.0"
description = "Automated LLM red-teaming harness: fires an OWASP-LLM-Top-10 attack catalog at any OpenAI-compatible endpoint and scores it with deterministic detectors."
authors = [{ name = "Al Amin Bashir Afara", email = "aminafara123@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["pyyaml>=6,<7"]

[project.scripts]
llm-redteam = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["redteam"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"
"llm.py" = "llm.py"
"attacks.yaml" = "attacks.yaml"
"sample_target" = "sample_target"
